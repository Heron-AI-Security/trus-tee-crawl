name: ci-publish
# Step P3.2 of the mentor's plan: make the reference values of the sealed image of a commit from two dummy runs, make release.json, and publish the files as a GitHub release.
# Why GitHub Actions with Workload Identity Federation, and how to change this: ADR-094, ADR-095 and docs/ci-publishing.md.
# It starts when a tag  publish-ref-<commit>  is pushed. The commit (9 to 40 hexadecimal digits) is the commit that BUILT the image; the code of this workflow comes from the tagged commit.
# An optional suffix after the commit  (publish-ref-<commit>-r2)  makes a new tag for a new publication: a release is never overwritten.
on:
  push:
    tags: ['publish-ref-*']
  workflow_dispatch:
# No other trigger on purpose: a pull request must never obtain a Google token.
permissions:
  contents: write   # creates the GitHub release that holds the published files
  id-token: write   # lets the job ask GitHub for the short-lived token that Google checks
concurrency:
  group: ci-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check that the three repository variables are set
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for v in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!v}" ]; then echo "::error::the repository variable $v is not set (run ops/ci/setup-gcp.sh, it prints the three values)"; missing=1; fi
          done
          exit "$missing"
      - name: Read the commit of the image from the tag name
        env:
          TAG: ${{ github.ref_name }}
        run: |
          rest="${TAG#publish-ref-}"; commit="${rest%%-*}"
          if ! [[ "$commit" =~ ^[0-9a-f]{9,40}$ ]]; then echo "::error::the tag '$TAG' must look like publish-ref-<9 to 40 hexadecimal digits of the commit that built the image>[-suffix]"; exit 1; fi
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "The image of commit $commit will be published by the tag $TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Let gcloud use the credentials that the sign-in step created
        # The same command as Google's setup-gcloud action runs; without it gcloud may list no account.
        run: gcloud --quiet auth login --force --cred-file "$GOOGLE_GHA_CREDS_PATH"
      - name: Remember the reference VMs that exist before this run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: gcloud compute instances list --project "$PROJECT_ID" --filter="labels.purpose=tc-reference-run" --format='value(name)' > "$RUNNER_TEMP/vms-before.txt"
      - name: Make the reference from two dummy runs, the release and the files to publish
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: bash ops/ci/publish-ref.sh publish-out
      - name: Publish the files as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          image="$(python3 -c 'import json; print(json.load(open("publish-out/publish/publication.json"))["image"])')"
          full="$(python3 -c 'import json; print(json.load(open("publish-out/publish/publication.json"))["image_commit"])')"
          printf 'Reference values of the sealed image %s, built from commit %s, made from two dummy runs by the workflow ci-publish.\n\nEvery file is listed with its SHA-256 in SHA256SUMS. release.json ties the commit to the image and to the root hash of its disk; reference.json holds the register values and the RTMR3 events; boot-tables.md lists every RTMR1 and RTMR2 event. See docs/ci-publishing.md and docs/mentor-plan-report.md.\n' "$image" "$full" > release-notes.md
          gh release create "$TAG" publish-out/publish/* --repo "$GITHUB_REPOSITORY" --title "Reference of commit ${full:0:12} (image $image)" --notes-file release-notes.md --verify-tag
      - name: Delete the reference VMs that this run left behind
        if: always()
        continue-on-error: true
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud compute instances list --project "$PROJECT_ID" --filter="labels.purpose=tc-reference-run" --format='value(name,zone.basename())' | while read -r name zone; do
            if ! grep -qx "$name" "$RUNNER_TEMP/vms-before.txt" 2>/dev/null; then echo "deleting the VM $name that this run left behind"; gcloud compute instances delete "$name" --zone "$zone" --project "$PROJECT_ID" --quiet; fi
          done

name: ci-smoke
# Step P3.1 of the mentor's plan: can CI sign in to Google Cloud, and does it hold the rights that publishing needs, and not many more? It creates nothing.
# Why GitHub Actions with Workload Identity Federation, and how to change this: ADR-094 and docs/ci-publishing.md.
# It runs when a tag that starts with ci-smoke- is pushed (a manual run needs this file on the default branch, so the tag is the way to start it).
on:
  push:
    tags: ['ci-smoke-*']
  workflow_dispatch:
# No other trigger on purpose: a pull request must never obtain a Google token.
permissions:
  contents: read
  id-token: write   # lets the job ask GitHub for the short-lived token that Google checks
concurrency:
  group: ci-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check that the three repository variables are set
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for v in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!v}" ]; then echo "::error::the repository variable $v is not set (run ops/ci/setup-gcp.sh, it prints the three values)"; missing=1; fi
          done
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Let gcloud use the credentials that the sign-in step created
        # The same command as Google's setup-gcloud action runs; without it gcloud may list no account.
        run: gcloud --quiet auth login --force --cred-file "$GOOGLE_GHA_CREDS_PATH"
      - name: Check the rights and the quota (creates nothing)
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          EXPECT_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: bash ops/ci/smoke.sh

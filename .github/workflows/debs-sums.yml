name: debs-sums
# The Ubuntu packages that the image build installs are committed in ops/image/debs, with their SHA-256 in ops/image/debs/SHA256SUMS. This job proves that the committed bytes are the ones that the hashes name (git can change the bytes of a file, for example a line-ending rule, and the commit would still look fine).
# It uses no secret and no cloud, so a pull request may run it. How it works and how to refresh the packages: ops/ci/debs-sums.sh and ops/image/build/tc-image-debs-capture.sh.
on:
  pull_request:
    paths: ['ops/image/debs/**', '.gitattributes', 'ops/ci/debs-sums.sh', '.github/workflows/debs-sums.yml']
  push:
    branches: [main]
    paths: ['ops/image/debs/**', '.gitattributes', 'ops/ci/debs-sums.sh', '.github/workflows/debs-sums.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sums:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The committed packages match SHA256SUMS
        run: bash ops/ci/debs-sums.sh

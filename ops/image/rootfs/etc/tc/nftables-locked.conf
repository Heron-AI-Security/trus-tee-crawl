#!/usr/sbin/nft -f
# The host firewall of a node of the fleet (step F0.5), baked into the image and measured. Everything that arrives is dropped except: loopback, answers to what
# this node asked for, the DHCP answer, the mesh (every packet that comes through wg0) and the WireGuard port itself. Nothing is open to the network around it.
flush ruleset
table inet tc {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    iifname "wg0" accept
    udp dport 51820 accept
    udp sport 67 udp dport 68 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
